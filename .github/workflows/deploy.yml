name: Deploy to Production

# Manual release of Dot.Press to pres.infodot.co.za. Nothing deploys on a
# push: run it from the Actions tab, or
#   gh workflow run deploy.yml -f confirm=deploy
#
# Two modes, chosen by the `confirm` input:
#   adopt   ONE TIME, for a live folder that is not yet on this pipeline:
#           either an uploaded copy (no .git) or a checkout of the host's own
#           history that was never pushed (drift.yml says which; the code
#           version is unknown either way). Run drift.yml first and read it.
#           `adopt` takes a rollback copy of the whole folder, turns it
#           into a checkout of origin/main (host-only commits are kept on a
#           local host-before-adopt-* branch) WITHOUT deleting anything untracked
#           (.env, storage/, database/, uploads) and then continues as a deploy,
#           except that pending migrations are only LISTED unless `migrate` is
#           also given (the rollback copy covers the SQLite file as of the deploy).
#   deploy  Every release after that: needs the checkout on this pipeline.
#
# What a run does, in order:
#   1. CI gate (ci.yml): tests, Pint, frontend build + Vite manifest check.
#   2. Builds the frontend on the runner (the host has no Node) and syncs it to
#      public/build.incoming on the host.
#   3. On the host: rollback copy, maintenance mode, code to origin/main,
#      composer install, production invariants (APP_DEBUG forced false; a
#      warning, not a change, for APP_ENV=local, an http APP_URL, or a setting
#      this host cannot run: a non-SQLite database, reverb/pusher/ably
#      broadcasting, a sync/redis queue, redis sessions or cache), swap in the
#      new public/build (a stray public/hot is removed), keep the docroot's build/ in step, migrations, caches,
#      back up.
#   4. Installs the cron lines (2: schedule:run, queue:work) through the shared crontab block, with its
#      lock and verified read-back. First run: the account total grows by 2.
#   5. Smoke check from the runner, like a browser: / and /login answer 200 and
#      do not reference a Vite dev server, the built CSS answers 200, /up answers 200, and a harmless POST /up (a
#      405) does not return a debug page.
#
# A failure after maintenance mode starts LEAVES the site down on purpose, with
# the rollback copy's name in the log, rather than guessing at an automatic
# rollback (the Dot.Agents pipeline's rollback fired after failures that never
# touched the server).
#
# Repository secrets: DEPLOY_HOST (pres.infodot.co.za), DEPLOY_USER,
# DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS. DEPLOY_PATH is optional: left unset, the
# app folder is found as the one `artisan` under the docroot.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" for a release, or "adopt" for the one-time takeover of the hand-uploaded folder'
        required: true
      migrate:
        description: 'adopt only: type "migrate" to also run pending migrations (a normal deploy always migrates)'
        required: false

concurrency:
  group: press-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: https://pres.infodot.co.za
  REPO_URL: https://github.com/sakhilebhayi/Dot.Press.git

jobs:
  confirm:
    name: Check the inputs
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.in.outputs.mode }}
      migrate: ${{ steps.in.outputs.migrate }}
    steps:
      - id: in
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
          MIGRATE_INPUT: ${{ github.event.inputs.migrate }}
        run: |
          case "$CONFIRM" in
            deploy|adopt) ;;
            *) echo '::error::Confirmation input must be exactly "deploy" or "adopt" -- aborting.'; exit 1 ;;
          esac
          echo "mode=$CONFIRM" >> "$GITHUB_OUTPUT"
          # A normal release always migrates; the takeover only on request.
          if [ "$CONFIRM" = "deploy" ] || [ "$MIGRATE_INPUT" = "migrate" ]; then
            echo "migrate=yes" >> "$GITHUB_OUTPUT"
          else
            echo "migrate=no" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: CI gate
    needs: confirm
    uses: ./.github/workflows/ci.yml

  deploy:
    name: ${{ needs.confirm.outputs.mode }} pres.infodot.co.za
    needs: [confirm, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # resources/js/app.js imports from vendor/ (tightenco/ziggy): the JS build
      # needs Composer's packages on the runner first.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: mbstring, intl, xml, fileinfo
      - name: Install PHP packages the JS imports from vendor/
        run: composer install --no-dev --no-scripts --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build the frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s public/build/manifest.json

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Locate the app on the host
        # DEPLOY_PATH is optional. Without it the app is found as the single
        # `artisan` within two levels of the docroot ~/<DEPLOY_HOST>; zero or
        # several is an error, not a guess.
        run: |
          APP="${{ secrets.DEPLOY_PATH }}"
          if [ -z "$APP" ]; then
            APP="$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
                "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                SITE="${{ secrets.DEPLOY_HOST }}" \
                'bash -s' <<'FIND'
          set -euo pipefail
          D="$HOME/$SITE"
          A="$(find "$D" -maxdepth 2 -name artisan -type f -exec dirname {} \; | sort -u)"
          if [ "$(printf '%s\n' "$A" | grep -c .)" != 1 ]; then
            echo "expected exactly one Laravel app under the docroot, found: ${A:-none}" >&2
            exit 1
          fi
          printf '%s\n' "$A"
          FIND
            )"
          fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          echo "App directory: ${APP#/home/}"

      # Staged beside the live build so the swap on the host is two renames,
      # and a failed upload leaves the running site untouched.
      - name: Upload the built frontend (staged)
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            public/build/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$APP_PATH/public/build.incoming/"

      - name: Deploy the code
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="$APP_PATH" \
              MODE="${{ needs.confirm.outputs.mode }}" \
              MIGRATE="${{ needs.confirm.outputs.migrate }}" \
              REPO_URL="$REPO_URL" \
              'bash -s' <<'DEPLOY'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP=php
          DOCROOT="$(dirname "$DEPLOY_PATH")"
          APPDIR="$(basename "$DEPLOY_PATH")"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"

          [ -f .env ] || { echo "::error::$DEPLOY_PATH has no .env. This pipeline updates a LIVE install; a first install needs its own bootstrap."; exit 1; }
          [ -d public/build.incoming ] || { echo "::error::the staged frontend (public/build.incoming) is missing -- the upload step did not run."; exit 1; }

          # ---- rollback copy, outside every web root; the newest three are kept
          BACKUP="$HOME/dot-press-$MODE-$STAMP.tgz"
          tar czf "$BACKUP" --exclude=./vendor --exclude=./node_modules --exclude=./storage/logs --exclude=./public/build --exclude=./public/build.incoming .
          chmod 600 "$BACKUP"
          ls -1t "$HOME"/dot-press-*.tgz | tail -n +4 | xargs -r rm -f
          echo "== Rollback copy: $BACKUP ($(du -h "$BACKUP" | cut -f1))  [restore: stop writes, tar xzf it over $DEPLOY_PATH]"

          # A failure leaves the site exactly as it is -- DOWN if maintenance
          # mode had started -- and says which, with the way back.
          trap 'if [ -f storage/framework/down ]; then echo "::error::The deploy failed AFTER maintenance mode started. The site was left DOWN on purpose. Rollback copy: $BACKUP. Inspect with server-logs.yml and run again, or restore the copy and run: php artisan up"; else echo "::error::The deploy failed BEFORE maintenance mode started; the site is still serving the previous release. Rollback copy: $BACKUP."; fi' ERR

          # Git hooks on the host never run during a release. The Forms host's old
          # checkout carried a Git LFS post-checkout hook but no git-lfs, so its
          # first adopt died on `git checkout` AFTER maintenance mode started.
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null

          # ---- application-folder guard (tolerant; runs BEFORE maintenance mode)
          # 2026-10-20: platforms whose app folder (~/<host>/<key>/, next to the docroot) had no
          # .htaccess served their live database, laravel.log, composer files and vendor/autoload.php
          # over HTTP. Make sure this folder always carries `Require all denied`: written new when
          # missing, appended (original kept as .htaccess.before-guard) when it lacks the directive,
          # left alone when it has it. Same behaviour as app-folder-guard.yml in InfoDot. This block
          # can never fail the release (set +e inside a subshell, `|| true` outside), so it cannot
          # leave the site in maintenance mode. The file is untracked, so neither `git reset --hard`
          # nor the takeover touches it. The folder is skipped if it is directly under $HOME (that
          # would be the docroot itself, where a deny file would take the site down).
          (
            set +e
            GFILE="$DEPLOY_PATH/.htaccess"
            if [ ! -f "$DEPLOY_PATH/artisan" ] || [ ! -d "$DEPLOY_PATH/public" ] || [ "$(dirname "$DEPLOY_PATH")" = "$HOME" ]; then
              echo "== app-folder guard: skipped ($DEPLOY_PATH does not look like an app folder below a docroot)"
            elif [ -f "$GFILE" ] && grep -q 'Require all denied' "$GFILE"; then
              echo "== app-folder guard: already present in $APPDIR/.htaccess"
            elif [ -f "$GFILE" ]; then
              if cp "$GFILE" "$GFILE.before-guard" && printf '\n# Dot: the application folder is never served.\nRequire all denied\n' >> "$GFILE"; then
                echo "== app-folder guard: appended to $APPDIR/.htaccess (original kept as .htaccess.before-guard)"
              else
                echo "::warning::app-folder guard: could not append to $APPDIR/.htaccess; deploy continues"
              fi
            else
              if printf '# Dot: the application folder is never served.\nRequire all denied\n' > "$GFILE"; then
                echo "== app-folder guard: written $APPDIR/.htaccess (new file)"
              else
                echo "::warning::app-folder guard: could not write $APPDIR/.htaccess; deploy continues"
              fi
            fi
          ) || true

          # ---- code
          if [ ! -d .git ]; then
            if [ "$MODE" != "adopt" ]; then
              echo "::error::$DEPLOY_PATH is not a git checkout yet. Run drift.yml, read it, then run this workflow once with confirm=adopt."; exit 1
            fi
            $PHP artisan down --retry=30 || true
            git init -q
            git remote add origin "$REPO_URL"
            git fetch -q origin main
            git reset -q origin/main
            echo "== Tracked files that differ on the host (replaced by main; copies are in the rollback tar):"
            git status --short | grep -v '^??' || echo "   (none)"
            git checkout -q -- .
            git checkout -q -B main origin/main
          else
            echo "== Current release: $(git rev-parse --short HEAD)"
            if [ "$MODE" = "adopt" ]; then
              # The folder is already a checkout, but of the host's own history
              # (commits that were never pushed). Keep that history on a branch
              # before main replaces the files, so nothing is lost even if the
              # rollback copy is later deleted.
              KEEP="host-before-adopt-$STAMP"
              git branch -f "$KEEP" HEAD
              echo "== Host history kept on local branch $KEEP (also inside the rollback copy)."
              echo "== Remote before: $(git remote get-url origin 2>/dev/null | sed 's#//[^@/]*@#//#' || echo none)"
              if git remote get-url origin >/dev/null 2>&1; then git remote set-url origin "$REPO_URL"; else git remote add origin "$REPO_URL"; fi
              echo "== Tracked files that differ or are deleted on the host (replaced by main; copies are in the rollback tar):"
              git status --short | grep -v '^??' | head -40 || echo "   (none)"
            fi
            git fetch -q origin main
            $PHP artisan down --retry=30 || true
            git reset --hard origin/main
            git checkout -q -B main origin/main
          fi
          echo "== Code: $(git rev-parse --short HEAD)"

          # ---- files on the host that main does not have
          # Untracked files survive a takeover on purpose (.env, uploads, local
          # state), so say what they are instead of only counting them.
          UNTRACKED="$(git ls-files --others --exclude-standard | grep -vE '^(storage/|bootstrap/cache/|public/build|database/[^/]*[.]sqlite)' || true)"
          if [ -n "$UNTRACKED" ]; then
            echo "== Files on the host that main does not have (kept; first 40):"
            printf '%s\n' "$UNTRACKED" | head -40 | sed 's/^/   /'
          fi
          # A host-only MIGRATION is the exception: `migrate` would run it next to
          # main's own files. On the real Dot.Projects host a leftover
          # 2026_06_27_000001_create_projects_table sorts before main's
          # create_projects migration, which is not guarded by hasTable, so a
          # normal deploy would fail AFTER maintenance mode started (reproduced on a
          # fake host). Move such files aside, never delete them; they are also
          # in the rollback copy.
          ORPHANS="$(git ls-files --others --exclude-standard -- database/migrations || true)"
          if [ -n "$ORPHANS" ]; then
            QUARANTINE="$HOME/dot-press-quarantine-$STAMP"
            mkdir -p "$QUARANTINE"
            printf '%s\n' "$ORPHANS" | while IFS= read -r f; do mv "$f" "$QUARANTINE/"; done
            echo "== Moved host-only migration file(s) aside (not in main; they would run beside main's own):"
            printf '%s\n' "$ORPHANS" | sed 's/^/   /'
            echo "   now in $QUARANTINE"
          fi

          composer install --no-interaction --optimize-autoloader --no-dev

          # ---- production invariants
          # APP_DEBUG=true makes any error, even a harmless 405, answer every
          # visitor with a ~840 KB debug page (ecosystem audit D9). Forced off
          # BEFORE the config cache is built so a hand-edited .env cannot put
          # it back.
          if grep -q '^APP_DEBUG=' .env; then
            sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          else
            printf '\nAPP_DEBUG=false\n' >> .env
          fi
          echo "== APP_DEBUG forced to false: $(grep '^APP_DEBUG=' .env | tail -1)"
          # Not changed here (it can alter behaviour), but never silent.
          if grep -q '^APP_ENV=local' .env; then echo "::warning::APP_ENV=local in the production .env; set it to production."; fi
          if grep -qE '^APP_URL=http://' .env; then echo "::warning::APP_URL is http://, not https://; set it to the https address."; fi
          # Settings this host cannot run: SQLite is the database, there is no
          # websocket server, Redis or Node, and cron (queue:work, schedule:run)
          # is the only worker. Warned about, never changed.
          envval() { grep -E "^$1=" .env | tail -1 | cut -d= -f2- | tr -d "\"'" | tr 'A-Z' 'a-z' || true; }
          DBC="$(envval DB_CONNECTION)"
          if [ -n "$DBC" ] && [ "$DBC" != "sqlite" ]; then echo "::warning::DB_CONNECTION=$DBC in the production .env; this host runs SQLite (DB_CONNECTION=sqlite)."; fi
          case "$(envval BROADCAST_CONNECTION)" in
            reverb|pusher|ably) echo "::warning::BROADCAST_CONNECTION=$(envval BROADCAST_CONNECTION) in the production .env; the host has no websocket server. Use null.";;
          esac
          case "$(envval QUEUE_CONNECTION)" in
            sync|redis) echo "::warning::QUEUE_CONNECTION=$(envval QUEUE_CONNECTION) in the production .env; use database (cron runs queue:work; there is no Redis).";;
          esac
          if [ "$(envval SESSION_DRIVER)" = "redis" ]; then echo "::warning::SESSION_DRIVER=redis in the production .env; there is no Redis. Use database."; fi
          if [ "$(envval CACHE_STORE)" = "redis" ]; then echo "::warning::CACHE_STORE=redis in the production .env; there is no Redis. Use database."; fi

          # ---- frontend: swap the staged build in, keep the docroot copy in step
          # public/build is gitignored, so git never refreshes it. The docroot
          # may serve its own build/ (a symlink, or on this host sometimes a
          # separate copy: Dot.Doc 404'd assets for days that way), and the
          # browser reads THAT one while @vite reads this app's manifest.
          rm -rf public/build.old
          [ -d public/build ] && mv public/build public/build.old
          mv public/build.incoming public/build
          rm -rf public/build.old
          # public/hot is written by `npm run dev` and makes @vite() point every
          # page at a dev server (http://[::1]:5173) that no visitor can reach.
          # It is gitignored, so git never removes it, and a hand-uploaded tree
          # can carry one onto the host. Production never runs a dev server.
          if [ -e public/hot ]; then rm -f public/hot; echo "== removed a stray public/hot (the Vite dev-server marker)"; fi
          LINK="$DOCROOT/build"
          if [ -L "$LINK" ]; then
            echo "== docroot build/ is a symlink; nothing to copy"
          elif [ -d "$LINK" ]; then
            rsync -a --delete public/build/ "$LINK/"
            echo "== docroot build/ is a real directory; mirrored from public/build"
          else
            ln -s "$APPDIR/public/build" "$LINK"
            echo "== docroot build/ did not exist; linked to $APPDIR/public/build"
          fi

          # ---- database
          echo "== Pending migrations:"
          $PHP artisan migrate:status --pending 2>&1 | tail -25 || true
          if [ "$MIGRATE" = "yes" ]; then
            $PHP artisan migrate --force
          else
            echo "== Migrations NOT run (takeover). Read the list above; the next confirm=deploy runs them, or re-run with migrate=migrate."
          fi

          # Targeted clears, NOT optimize:clear: that also empties the cache
          # store, which here is the database. If the host database lacks the
          # cache table the deploy would crash with the site in maintenance
          # mode (found by running this script against a fake host), and a
          # release has no business flushing sessions' companions anyway.
          $PHP artisan config:clear
          $PHP artisan route:clear
          $PHP artisan view:clear
          $PHP artisan event:clear
          $PHP artisan config:cache
          $PHP artisan route:cache
          $PHP artisan view:cache
          $PHP artisan event:cache

          $PHP artisan up
          trap - ERR
          echo "== Deployed: $(git rev-parse --short HEAD)"
          DEPLOY

      - name: Install the scheduler cron line
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="$APP_PATH" \
              'bash -s' <<'CRON'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP=php
          # ---- crontab: repair this app's lines, never touch anyone else's ----
          # Rule for this account: the crontab is written only by deploy
          # workflows, each touches only lines carrying its own marker, and a
          # write is verified before and after. 2026-08-31: a pipeline whose read
          # failed installed an EMPTY crontab and silently killed Dot.Mines'
          # scheduler for six weeks. cron runs with a minimal PATH, so lines carry
          # the absolute PHP path and keep their last output in a log file.
          MARK="# dot-press"
          # One writer at a time on this account: deploys of different apps can
          # coincide and would otherwise race on the single crontab.
          command -v flock > /dev/null || { echo "::error::flock is not installed on the host; crontab writes cannot be serialised"; exit 1; }
          exec 9>"$HOME/.dot-crontab.lock"; flock -w 120 9 || { echo "::error::could not take the crontab lock within 120 s (another deploy is writing the crontab)"; exit 1; }
          PHP_BIN="$(command -v "${PHP:-php}")"
          OLD="$(mktemp)"; NEW="$(mktemp)"; CHK="$(mktemp)"; ERR="$(mktemp)"
          # crontab -l on this host can transiently answer empty (seen 2026-10-16,
          # right after a write, under the lock). A read is trusted only when it
          # is non-empty or the host says there is no crontab; otherwise retry.
          read_crontab() {
            local i
            for i in 1 2 3 4 5; do
              if crontab -l > "$1" 2> "$ERR"; then
                [ -s "$1" ] && return 0
              elif grep -qi "no crontab for" "$ERR"; then
                : > "$1"; return 0
              fi
              sleep 2
            done
            return 1
          }
          if ! read_crontab "$OLD"; then
            echo "::error::crontab -l answered empty or failed five times ($(cat "$ERR")). Refusing to write a crontab I could not read."; exit 1
          fi
          KEY="${MARK#\# dot-}"
          EXPECT_MINE=2
          OTHERS=$(grep -v "$MARK" "$OLD" | grep -c . || true)
          {
            grep -v "$MARK" "$OLD" || true
            echo "* * * * * cd $DEPLOY_PATH && exec $PHP_BIN artisan schedule:run > storage/logs/cron-scheduler.log 2>&1 $MARK"
            echo "* * * * * cd $DEPLOY_PATH && exec $PHP_BIN artisan queue:work --stop-when-empty --tries=3 --max-time=50 > storage/logs/cron-queue.log 2>&1 $MARK"
          } > "$NEW"
          # Runner mode (InfoDot docs/programme R-1): when the account runs the bounded-concurrency cron runner
          # (InfoDot: Cron Runner workflow, "install"), this app's commands go to ~/.dot-cron.d/$KEY.cron and the
          # runner starts them, at most 4 at a time, away from second 0. Its own crontab lines are removed (a migration
          # on deploy). Without the runner the lines above are installed as before.
          if [ -x "$HOME/bin/dot-cron-runner" ] && grep -q '# dot-cron-runner' "$OLD"; then
            CMDS="$(grep -F -- "$MARK" "$NEW" | sed -E 's/^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ //; s/ *# dot-[a-z0-9-]*$//' || true)"
            mkdir -p "$HOME/.dot-cron.d"
            if [ -n "$CMDS" ]; then
              printf '%s\n' "$CMDS" > "$HOME/.dot-cron.d/$KEY.cron.tmp" && mv "$HOME/.dot-cron.d/$KEY.cron.tmp" "$HOME/.dot-cron.d/$KEY.cron"
            else
              rm -f "$HOME/.dot-cron.d/$KEY.cron"
            fi
            grep -v -F -- "$MARK" "$NEW" > "$NEW.t" || true; mv "$NEW.t" "$NEW"
            EXPECT_MINE=0
            echo "== runner mode: $(printf '%s' "$CMDS" | grep -c . || true) command(s) written to ~/.dot-cron.d/$KEY.cron, none left in the crontab"
          fi
          crontab "$NEW"
          read_crontab "$CHK" || : > "$CHK"
          AFTER=$(grep -v "$MARK" "$CHK" | grep -c . || true)
          MINE=$(grep -c "$MARK" "$CHK" || true)
          if [ "$AFTER" != "$OTHERS" ] || [ "$MINE" != "$EXPECT_MINE" ]; then
            crontab "$OLD"
            echo "::error::crontab verification failed (other lines before=$OTHERS after=$AFTER, mine=$MINE, expected=$EXPECT_MINE); the previous crontab was restored."; exit 1
          fi
          rm -f "$OLD" "$NEW" "$CHK" "$ERR"; flock -u 9
          echo "== crontab: $MINE line(s) for $MARK installed, $OTHERS other line(s) preserved"
          CRON

      - name: Smoke-check the live site
        run: |
          set -uo pipefail
          WORK="$(mktemp -d)"
          FAILED=0
          for PAGE in "/" "/login" "/up"; do
            CODE=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' "$SITE_URL$PAGE" || true)
            if [ "$CODE" = "200" ]; then echo "200 $SITE_URL$PAGE"; else echo "::error::$SITE_URL$PAGE answered ${CODE:-no response} (expected 200)"; FAILED=1; fi
          done
          # No page may point at a Vite dev server: that is what a stray public/hot
          # file does, and the site then renders with no styles at all.
          for PAGE in "/" "/login"; do
            if curl -s --max-time 30 "$SITE_URL$PAGE" | grep -qE ':5173|@vite/client'; then
              echo "::error::$SITE_URL$PAGE references the Vite dev server (a public/hot file on the host): the page has no usable CSS or JS."; FAILED=1
            else
              echo "No Vite dev-server references on $SITE_URL$PAGE"
            fi
          done
          for ASSET in $(python3 -c "import json; m=json.load(open('public/build/manifest.json')); print(' '.join(sorted({v['file'] for v in m.values() if v.get('isEntry')} | {f for v in m.values() if v.get('isEntry') for f in v.get('css', [])})))"); do
            CODE=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' "$SITE_URL/build/$ASSET" || true)
            if [ "$CODE" = "200" ]; then echo "200 $SITE_URL/build/$ASSET"; else echo "::error::$SITE_URL/build/$ASSET answered ${CODE:-no response} (expected 200): the docroot is not serving the new build"; FAILED=1; fi
          done
          # A GET-only route answering POST is a harmless 405: ~1 KB in
          # production, an ~840 KB stack-trace page when APP_DEBUG is on.
          curl -s --max-time 30 -o "$WORK/probe.html" -X POST "$SITE_URL/up" || true
          if grep -qiE 'vendor/laravel|stack trace' "$WORK/probe.html"; then
            echo "::error::POST $SITE_URL/up answered with a debug error page: APP_DEBUG is still on."; FAILED=1
          else
            echo "No debug page on POST $SITE_URL/up ($(wc -c < "$WORK/probe.html" | tr -d ' ') bytes)"
          fi
          rm -rf "$WORK"
          [ "$FAILED" -eq 0 ] || { echo "::error::Smoke check failed: the deploy is NOT healthy."; exit 1; }
          echo "== Smoke check passed."

      # Public probe, from the runner, after `artisan up` and the smoke check: the application folder
      # (~/<host>/<key>/, key = last segment of APP_PATH) must not answer over HTTP. Only status codes are
      # logged and nothing is read. 200 = served = red run; 301/302/403/404 are fine. It runs after the site
      # is back up, so it can only turn the run red, never leave the site down. Same path list as
      # tools/probe-exposure.sh in InfoDot (kept inline: no cross-repo dependency).
      - name: Probe the application folder from outside
        run: |
          set -uo pipefail
          if [ -z "${APP_PATH:-}" ] || [ -z "${SITE_URL:-}" ]; then echo "::error::APP_PATH or SITE_URL is not set; cannot probe the application folder."; exit 1; fi
          KEY="$(basename "$APP_PATH")"
          sleep 5   # the web server re-reads .htaccess lazily
          BAD=0
          for P in .env .env.bak-secrets artisan composer.json composer.lock database/database.sqlite storage/logs/laravel.log vendor/autoload.php phpunit.xml; do
            CODE=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$SITE_URL/$KEY/$P" || true)
            if [ "$CODE" = "200" ]; then echo "::error::$KEY/$P answered 200: the application folder is readable over HTTP"; BAD=1; else echo "$KEY/$P $CODE"; fi
          done
          [ "$BAD" = 0 ] || { echo "::error::An application-folder path is served over HTTP. Put 'Require all denied' in the app folder's .htaccess (app-folder-guard.yml in InfoDot) and re-run."; exit 1; }
          echo "== Application folder not readable over HTTP."
